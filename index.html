<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Адаптометр | Квест | Психотесты</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a0f2a 0%, #0a1a3a 50%, #0a0f2a 100%);
    font-family: -apple-system, 'Segoe UI', 'SF Pro Text', system-ui, sans-serif;
}

/* Звездный фон */
.star {
    position: fixed;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    animation: twinkle 3s infinite alternate;
}
@keyframes twinkle {
    0% { opacity: 0.2; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.2); }
}

/* ===== ЭКРАН АВТОРИЗАЦИИ ===== */
#loginScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    background: linear-gradient(135deg, #0a0f2a, #0a1a3a);
    transition: opacity 0.5s ease;
}

.login-card {
    background: rgba(10, 15, 42, 0.85);
    backdrop-filter: blur(20px);
    border-radius: 48px;
    padding: 40px 32px;
    width: 360px;
    text-align: center;
    border: 1px solid rgba(79, 172, 254, 0.3);
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    animation: fadeInUp 0.6s ease;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.login-logo {
    font-size: 48px;
    font-weight: 800;
    background: linear-gradient(135deg, #fff, #4facfe, #00f2fe);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
}

.login-sub {
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    margin-bottom: 30px;
}

.login-input {
    width: 100%;
    padding: 14px 18px;
    margin: 10px 0;
    border: none;
    border-radius: 60px;
    background: rgba(255,255,255,0.12);
    color: white;
    font-size: 15px;
    transition: 0.2s;
}

.login-input:focus {
    outline: none;
    background: rgba(255,255,255,0.18);
    box-shadow: 0 0 0 2px rgba(79,172,254,0.4);
}

.login-input::placeholder {
    color: rgba(255,255,255,0.5);
}

/* Выбор режима */
.mode-selector {
    display: flex;
    gap: 15px;
    margin: 20px 0 15px;
}

.mode-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 60px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
}

.mode-btn.active {
    background: linear-gradient(45deg, #4facfe, #00f2fe);
    color: white;
    box-shadow: 0 4px 15px rgba(79,172,254,0.3);
}

.login-btn {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 60px;
    background: linear-gradient(45deg, #4facfe, #00f2fe);
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.login-btn:hover {
    transform: scale(0.98);
    opacity: 0.9;
}

.forgot-link {
    margin-top: 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
}

.test-creds {
    margin-top: 20px;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.1);
}

/* ===== ОСНОВНОЙ ЭКРАН ===== */
#mainApp {
    display: none;
    padding: 20px;
    padding-bottom: 80px;
    min-height: 100vh;
}

/* Шапка */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(15px);
    border-radius: 50px;
    padding: 12px 20px;
    margin-bottom: 20px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    background: linear-gradient(135deg, #fff, #4facfe);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.user-badge {
    background: rgba(79,172,254,0.25);
    padding: 6px 14px;
    border-radius: 40px;
    font-size: 14px;
    color: white;
    cursor: pointer;
}

.mode-badge {
    background: rgba(0,0,0,0.5);
    padding: 6px 14px;
    border-radius: 40px;
    font-size: 12px;
    color: #4facfe;
}

/* ===== - ПСИХОЛОГИЧЕСКИЙ ТЕСТ ===== */
.phone-frame {
    background: #111128;
    border-radius: 44px;
    padding: 16px;
    margin-bottom: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
}

.dynamic-island {
    background: rgba(0,0,0,0.7);
    border-radius: 26px;
    padding: 6px 14px;
    font-size: 11px;
    text-align: center;
    color: #4facfe;
    width: fit-content;
    margin: 0 auto 12px;
}

.psycho-tab {
    background: rgba(255,255,255,0.03);
    border-radius: 36px;
    overflow: hidden;
}

.tab-header {
    display: flex;
    background: rgba(0,0,0,0.4);
}

.tab-btn {
    flex: 1;
    padding: 14px 8px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.tab-btn.active {
    color: #4facfe;
    border-bottom: 2px solid #4facfe;
}

.tab-content {
    display: none;
    padding: 20px;
    animation: fadeSlide 0.3s ease;
}

.tab-content.active {
    display: block;
}

@keyframes fadeSlide {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.test-card-phone {
    background: rgba(255,255,255,0.06);
    border-radius: 28px;
    padding: 20px;
    margin-bottom: 16px;
}

.test-title-phone {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: white;
}

.test-desc-phone {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 12px;
    line-height: 1.4;
}

.energy-meter-phone {
    background: rgba(255,255,255,0.15);
    border-radius: 16px;
    height: 8px;
    margin: 12px 0;
    overflow: hidden;
}

.energy-fill-phone {
    height: 100%;
    border-radius: 16px;
    transition: width 0.4s;
}

.energy-high { background: linear-gradient(90deg, #00ff99, #4facfe); }
.energy-medium { background: linear-gradient(90deg, #ffaa00, #ffcc00); }
.energy-low { background: linear-gradient(90deg, #ff4444, #ff6666); }

.btn-test {
    background: rgba(79,172,254,0.2);
    border: 1px solid rgba(79,172,254,0.4);
    padding: 10px 24px;
    border-radius: 40px;
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.2s;
}

.btn-test:hover {
    background: #4facfe;
}

.questions-container {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.1);
    display: none;
}

.questions-container.open {
    display: block;
    animation: slideDown 0.3s;
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

.question-item {
    margin-bottom: 18px;
}

.question-text {
    font-size: 14px;
    margin-bottom: 10px;
    color: white;
    font-weight: 500;
    line-height: 1.4;
}

.options-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.opt-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 13px;
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

.opt-btn.selected {
    background: #4facfe;
    box-shadow: 0 2px 8px rgba(79,172,254,0.3);
}

.result-card {
    margin-top: 16px;
    padding: 16px;
    border-radius: 24px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
}

.result-card.show {
    display: block;
    animation: fadeIn 0.3s;
}

.result-good { background: rgba(0,255,153,0.15); border-left: 3px solid #00ff99; color: #ccffdd; }
.result-warning { background: rgba(255,170,0,0.15); border-left: 3px solid #ffaa00; color: #ffecb3; }
.result-bad { background: rgba(255,68,68,0.15); border-left: 3px solid #ff4444; color: #ffcccc; }

/* ===== КВЕСТ (сетка сфер) ===== */
.quest-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 20px 0 16px;
}

.quest-title {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(135deg, #fff, #4facfe);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.quest-count {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    font-weight: 500;
}

.directions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
}

.direction-card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 16px 12px;
    text-align: center;
    transition: 0.2s;
    border: 1px solid rgba(255,255,255,0.08);
}

.direction-card:hover {
    transform: translateY(-3px);
    background: rgba(79,172,254,0.12);
    border-color: rgba(79,172,254,0.3);
}

.direction-icon {
    font-size: 36px;
    margin-bottom: 8px;
}

.direction-name {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 12px;
    color: white;
    line-height: 1.35;
}

.sphere {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: linear-gradient(145deg, #1e3c72, #2a5298);
    box-shadow: 0 0 12px rgba(0,150,255,0.3);
    cursor: pointer;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.sphere:hover {
    transform: scale(1.05);
    box-shadow: 0 0 18px rgba(79,172,254,0.5);
}

.sphere.done {
    background: linear-gradient(145deg, #00cc66, #00aa55);
    box-shadow: 0 0 18px #00ff99;
}

.sphere.done::after {
    content: "✓";
    font-size: 28px;
    color: white;
    font-weight: bold;
}

.status {
    font-size: 11px;
    margin-top: 8px;
    display: block;
    font-weight: 500;
}

.status-done {
    color: #00ff99;
}

.status-pending {
    color: rgba(255,255,255,0.45);
}

/* Прогресс-бар */
.progress-section {
    margin: 24px 0;
}

.progress-bar {
    background: rgba(255,255,255,0.12);
    border-radius: 20px;
    height: 10px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    border-radius: 20px;
    transition: width 0.3s;
}

.progress-text {
    text-align: center;
    font-size: 13px;
    margin-top: 8px;
    color: rgba(255,255,255,0.7);
    font-weight: 500;
}

/* Сертификат */
.certificate-box {
    display: none;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    border-radius: 28px;
    padding: 20px;
    text-align: center;
    margin-top: 20px;
}

.certificate-box h3 {
    color: #1a1a2e;
    font-size: 20px;
    margin-bottom: 8px;
}

.certificate-box p {
    color: #1a1a2e;
    font-size: 13px;
    margin-bottom: 12px;
}

.cert-code {
    font-size: 18px;
    font-weight: bold;
    background: white;
    display: inline-block;
    padding: 8px 20px;
    border-radius: 40px;
    color: #1a1a2e;
}

/* Нижняя навигация */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(8, 12, 35, 0.95);
    backdrop-filter: blur(20px);
    display: flex;
    justify-content: space-around;
    padding: 10px 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
    z-index: 100;
}

.nav-item {
    text-align: center;
    cursor: pointer;
    padding: 6px 16px;
    border-radius: 30px;
    transition: 0.2s;
}

.nav-item.active {
    background: rgba(79,172,254,0.2);
}

.nav-icon {
    font-size: 24px;
}

.nav-label {
    font-size: 11px;
    margin-top: 4px;
    color: rgba(255,255,255,0.7);
    font-weight: 500;
}

/* Модалка кода */
.modal {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    z-index: 200;
}

.modal-content {
    background: linear-gradient(135deg, #1a1a3e, #121232);
    padding: 28px;
    border-radius: 44px;
    text-align: center;
    width: 300px;
}

.modal-content h3 {
    color: white;
    font-size: 20px;
    margin-bottom: 8px;
}

.modal-content p {
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    margin-bottom: 16px;
}

.modal-input {
    width: 100%;
    padding: 14px;
    margin: 12px 0;
    border: none;
    border-radius: 60px;
    background: rgba(255,255,255,0.1);
    color: white;
    text-align: center;
    font-size: 16px;
    letter-spacing: 1px;
}

.modal-input::placeholder {
    color: rgba(255,255,255,0.4);
}

.modal-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.modal-btn {
    padding: 10px 24px;
    border: none;
    border-radius: 40px;
    background: linear-gradient(45deg, #4facfe, #00f2fe);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.modal-btn.secondary {
    background: rgba(255,255,255,0.15);
}

.shake {
    animation: shakeAnim 0.3s ease;
}

@keyframes shakeAnim {
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}
}

/* Чат */
.chat-fab {
    position: fixed;
    bottom: 80px;
    right: 16px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border: none;
    box-shadow: 0 4px 15px rgba(79,172,254,0.5);
    cursor: pointer;
    font-size: 26px;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.chat-fab:hover {
    transform: scale(1.05);
}

.chat-window {
    position: fixed;
    bottom: 100px;
    right: 16px;
    width: 310px;
    background: rgba(10, 15, 42, 0.97);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    z-index: 95;
    display: none;
    border: 1px solid rgba(79,172,254,0.3);
}

.chat-header {
    padding: 14px 18px;
    background: rgba(79,172,254,0.15);
    border-radius: 28px 28px 0 0;
    display: flex;
    justify-content: space-between;
    color: white;
    font-weight: 600;
}

.chat-msgs {
    height: 240px;
    overflow-y: auto;
    padding: 14px;
    font-size: 13px;
}

.chat-msgs div {
    margin-bottom: 8px;
    color: rgba(255,255,255,0.9);
    line-height: 1.4;
}

.chat-input-area {
    display: flex;
    padding: 12px;
    gap: 8px;
    border-top: 1px solid rgba(255,255,255,0.1);
}

.chat-input-area input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 30px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 13px;
}

.chat-input-area input::placeholder {
    color: rgba(255,255,255,0.5);
}

.chat-input-area button {
    background: #4facfe;
    border: none;
    border-radius: 30px;
    padding: 8px 16px;
    color: white;
    cursor: pointer;
    font-weight: 600;
}
</style>
</head>
<body>

<!-- ЭКРАН АВТОРИЗАЦИИ С ВЫБОРОМ РЕЖИМА -->
<div id="loginScreen">
    <div class="login-card">
        <div class="login-logo">АДАПТОМЕТР</div>
        <div class="login-sub">выберите режим</div>
        
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="quest">🎮 КВЕСТ</button>
            <button class="mode-btn" data-mode="tests">🧠 ТЕСТЫ</button>
        </div>
        
        <input type="text" id="loginInput" class="login-input" placeholder="Логин" autocomplete="off">
        <input type="password" id="passwordInput" class="login-input" placeholder="Пароль">
        
        <button class="login-btn" onclick="login()">➡️ ВОЙТИ</button>
        
        <div class="forgot-link" onclick="alert('📧 Восстановление: обратитесь к администратору')">забыли пароль?</div>
        
        <div class="test-creds">
            🔑 Тестовые данные:<br>
            admin / 1234<br>
            test / test
        </div>
    </div>
</div>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ (динамически заполняется) -->
<div id="mainApp">
    <div class="header">
        <div class="logo">⚡ АДАПТОМЕТР</div>
        <div style="display: flex; gap: 10px;">
            <div class="mode-badge" id="modeBadge">🎮 КВЕСТ</div>
            <div class="user-badge" id="userBadge">👤 <span id="userName">admin</span></div>
        </div>
    </div>

    <!-- Контейнер для динамического контента (Квест или Тесты) -->
    <div id="dynamicContent"></div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <div class="nav-item" data-nav="quest">
            <div class="nav-icon">🎮</div>
            <div class="nav-label">Квест</div>
        </div>
        <div class="nav-item" data-nav="tests">
            <div class="nav-icon">🧠</div>
            <div class="nav-label">Тесты</div>
        </div>
        <div class="nav-item" data-nav="help" onclick="emergencyHelp()">
            <div class="nav-icon">🆘</div>
            <div class="nav-label">Помощь</div>
        </div>
    </div>
</div>

<!-- Кнопка чата -->
<button class="chat-fab" id="chatFab">💬</button>
<div class="chat-window" id="chatWindow">
    <div class="chat-header">
        <span>🤖 AI Помощник</span>
        <button id="closeChat" style="background:none; border:none; color:white; font-size:20px;">✕</button>
    </div>
    <div class="chat-msgs" id="chatMsgs">
        <div>🤖 Привет! Я AI-помощник. Спрашивай про коды или тесты!</div>
    </div>
    <div class="chat-input-area">
        <input id="chatInput" placeholder="Спроси меня...">
        <button id="chatSendBtn">Отпр.</button>
    </div>
</div>

<!-- Модалка ввода кода -->
<div class="modal" id="codeModal">
    <div class="modal-content">
        <h3>🔐 Код активации</h3>
        <p>Введите код для прохождения направления</p>
        <input type="text" id="codeInput" class="modal-input" placeholder="Например: СОВ20240">
        <div class="modal-buttons">
            <button class="modal-btn" onclick="checkCode()">Подтвердить</button>
            <button class="modal-btn secondary" onclick="closeModal()">Отмена</button>
        </div>
    </div>
</div>

<script>
// ========== 19 НАПРАВЛЕНИЙ ДЛЯ КВЕСТА ==========
const DIRECTIONS = [
    "Совет обучающихся", "Тьюторское движение", "Корпус старост", "Центр изучения общественного мнения",
    "Туристический центр", "Патриотический клуб «я горжусь»", "Совет студенческих землячеств",
    "Совет молодых ученых", "Студенческое научное общество", "Студенческие медицинские отряды",
    "Волонтерский центр", "Донорское движение", "Навигаторы поступления", "Тренинговый центр",
    "Студенческий спортивный клуб", "Медиацентр", "Профсоюз студентов", "Культура и творчество",
    "Студенческий бизнес-инкубатор"
];

// Генерация кодов (первые 3 буквы + 2024 + номер)
const DIR_CODES = {};
DIRECTIONS.forEach((name, idx) => {
    let prefix = name.substring(0, 3).toUpperCase();
    if (prefix === "ПАР") prefix = "ПАТ";
    if (prefix === "СТУ") prefix = "СТД";
    DIR_CODES[name] = prefix + "2024" + idx;
});

    "Центр изучения общественного мнения":"📊","Туристический центр":"⛰️","Патриотический клуб «я горжусь»":"🇷🇺",

};

// ========== ТЕСТЫ ==========

const testQuestions = {
    fatigue: { 
        q: ["Чувствуете ли вы усталость к середине дня?", "Трудно ли вам концентрироваться на задачах?", "Чувствуете ли вы физическую слабость?"],

        opts: ["Никогда", "Редко", "Часто", "Очень часто"],

    },

        opts: ["Отлично", "Хорошо", "Удовлетворительно", "Плохо"], 
        scores: [0,1,2,3] 
    }
};

let currentUser = null;
let currentMode = "quest"; // "quest" или "tests"
let currentDir = null;
let currentSphereElem = null;

// ========== ОБЩИЕ ФУНКЦИИ ==========
function chatMsg(msg) {
    const msgs = document.getElementById('chatMsgs');
    const div = document.createElement('div');
    div.innerHTML = `🤖 ${msg}`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
}

function emergencyHelp() {
    alert("🚨 ЭКСТРЕННАЯ ПОМОЩЬ 🚨\n\n📞 Психолог: +7 (800) 123-45-67\n📧 Поддержка: support@adaptrom.ru\n💬 Чат с оператором: 24/7");
}

// ========== КВЕСТ ==========
function getProgress() {
    if (!currentUser) return {};
    return JSON.parse(localStorage.getItem(`progress_${currentUser}`) || "{}");
}

function saveProgress(p) {
    localStorage.setItem(`progress_${currentUser}`, JSON.stringify(p));
    if (currentMode === "quest") renderQuestContent();
}

function renderQuestContent() {
    const container = document.getElementById('dynamicContent');
    const prog = getProgress();
    const completedCount = Object.keys(prog).length;
    
    const html = `
        <div class="quest-header">
            <div class="quest-title">🎯 КВЕСТ-МАРАФОН</div>
            <div class="quest-count">${completedCount}/${DIRECTIONS.length}</div>
        </div>
        <div class="directions-grid" id="questGrid"></div>
        <div class="progress-section">
            <div class="progress-bar"><div class="progress-fill" id="questProgressFill" style="width: ${(completedCount/DIRECTIONS.length)*100}%"></div></div>
            <div class="progress-text">${completedCount} из ${DIRECTIONS.length} направлений пройдено (${Math.round((completedCount/DIRECTIONS.length)*100)}%)</div>
        </div>
        <div id="certificateBox" class="certificate-box" style="display: ${completedCount === DIRECTIONS.length ? 'block' : 'none'}">
            <h3>🏆 ПОЗДРАВЛЯЕМ! 🏆</h3>
            <p>Вы прошли все 19 направлений Адаптометра!</p>
            <div class="cert-code" id="certCode">${localStorage.getItem(`cert_${currentUser}`) || ''}</div>
        </div>
    `;
    container.innerHTML = html;
    
    const grid = document.getElementById('questGrid');
    DIRECTIONS.forEach(name => {
        const code = DIR_CODES[name];
        const done = prog[code];
        const card = document.createElement('div');
        card.className = 'direction-card';
        card.innerHTML = `
            <div class="direction-icon">${ICONS[name] || '⭐'}</div>
            <div class="direction-name">${name}</div>
            <div class="sphere ${done ? 'done' : ''}" data-name="${name}"></div>
            <span class="status ${done ? 'status-done' : 'status-pending'}">${done ? '✓ Пройдено' : '🔒 Активировать'}</span>
        `;
        grid.appendChild(card);
        const sphere = card.querySelector('.sphere');
        sphere.onclick = () => {
            if (!prog[code]) openCodeModal(name, sphere, code);
            else chatMsg(`✅ "${name}" уже пройдено!`);
        };
    });
    
    // Сертификат
    if (completedCount === DIRECTIONS.length) {
        let cert = localStorage.getItem(`cert_${currentUser}`);
        if (!cert) {
            cert = "MERCH-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            localStorage.setItem(`cert_${currentUser}`, cert);
        }
        document.getElementById('certCode').innerText = cert;
    }
}

function openCodeModal(name, elem, code) {
    currentDir = name;
    currentSphereElem = elem;
    document.getElementById('codeInput').value = '';
    document.getElementById('codeModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('codeModal').style.display = 'none';
}

function checkCode() {
    const inp = document.getElementById('codeInput').value.trim().toUpperCase();
    const expected = DIR_CODES[currentDir];
    const prog = getProgress();
    
    if (inp === expected) {
        prog[expected] = true;
        saveProgress(prog);
        if (currentSphereElem) currentSphereElem.classList.add('done');
        chatMsg(`🎉 Поздравляю! Направление "${currentDir}" активировано! Осталось ${DIRECTIONS.length - Object.keys(prog).length} направлений.`);
        closeModal();
        renderQuestContent();
    } else {
        chatMsg(`❌ Неверный код для "${currentDir}". Правильный код: ${expected}`);
        document.getElementById('codeInput').classList.add('shake');
        setTimeout(() => document.getElementById('codeInput').classList.remove('shake'), 300);
    }
}

// ========== ТЕСТЫ ==========
function startTest(type) {
    const container = document.getElementById(`${type}Questions`);
    const qs = testQuestions[type].q;
    let html = '';
    qs.forEach((q, i) => {
        html += `<div class="question-item">
            <div class="question-text">${i+1}. ${q}</div>
            <div class="options-row" id="opts-${type}-${i}">
                ${testQuestions[type].opts.map((opt, oi) => `<button class="opt-btn" onclick="selectOpt('${type}',${i},${oi})">${opt}</button>`).join('')}
            </div>
        </div>`;
    });
    html += `<button class="btn-test" style="margin-top:12px;" onclick="submitTest('${type}')">✅ Завершить тест</button>`;
    container.innerHTML = html;
    container.classList.add('open');
}

function selectOpt(type, qIdx, optIdx) {
    testAnswers[type][qIdx] = optIdx;
    const parent = document.getElementById(`opts-${type}-${qIdx}`);
    if (parent) {
        Array.from(parent.children).forEach((btn, i) => {
            if (i === optIdx) btn.classList.add('selected');
            else btn.classList.remove('selected');
        });
    }
}

function submitTest(type) {
    const total = testQuestions[type].q.length;
    if (!testAnswers[type] || testAnswers[type].length < total || testAnswers[type].some(a => a === undefined)) {
        alert("❓ Ответьте на все вопросы, чтобы получить результат!");
        return;
    }
    
    let score = 0;
    testAnswers[type].forEach(a => score += testQuestions[type].scores[a]);
    const max = total * 3;
    const percent = (score / max) * 100;
    
    let text = "", cls = "", energyW = 0;
    if (type === 'fatigue') {
        if (percent < 33) { text = "✅ Низкий уровень утомления. Вы хорошо восстановлены!"; cls = "result-good"; energyW = 80; }
        else if (percent < 66) { text = "⚠️ Средний уровень утомления. Рекомендуется отдых."; cls = "result-warning"; energyW = 50; }
        else { text = "🔴 Высокий уровень утомления! Необходим полноценный отдых."; cls = "result-bad"; energyW = 25; }
        document.getElementById('energyFill1').style.width = (100 - percent) + '%';
        document.getElementById('energyFill1').className = `energy-fill-phone ${energyW >= 60 ? 'energy-high' : energyW >= 30 ? 'energy-medium' : 'energy-low'}`;
    } else if (type === 'stress') {
        if (percent < 33) { text = "✅ Нормальный уровень стресса. Вы спокойны."; cls = "result-good"; energyW = 75; }
        else if (percent < 66) { text = "⚠️ Повышенный уровень стресса. Попробуйте техники релаксации."; cls = "result-warning"; energyW = 45; }
        else { text = "🔴 Высокий уровень стресса! Рекомендуется консультация психолога."; cls = "result-bad"; energyW = 20; }
        document.getElementById('energyFill2').style.width = (100 - percent) + '%';
        document.getElementById('energyFill2').className = `energy-fill-phone ${energyW >= 60 ? 'energy-high' : energyW >= 30 ? 'energy-medium' : 'energy-low'}`;
    } else {
        if (percent < 33) { text = "✅ Отличное качество сна! Вы хорошо восстанавливаетесь."; cls = "result-good"; energyW = 85; }
        else if (percent < 66) { text = "⚠️ Удовлетворительное качество сна. Постарайтесь ложиться раньше."; cls = "result-warning"; energyW = 55; }
        else { text = "🔴 Плохое качество сна! Обратите внимание на режим дня."; cls = "result-bad"; energyW = 30; }
        document.getElementById('energyFill3').style.width = (100 - percent) + '%';
        document.getElementById('energyFill3').className = `energy-fill-phone ${energyW >= 60 ? 'energy-high' : energyW >= 30 ? 'energy-medium' : 'energy-low'}`;
    }
    
    const resDiv = document.getElementById(`${type}Result`);
    resDiv.innerHTML = `<strong>📊 Результат:</strong><br>${text}<br><small>Баллы: ${score} из ${max}</small>`;
    resDiv.className = `result-card show ${cls}`;
    
    localStorage.setItem(`${type}_${currentUser}`, JSON.stringify({ score, percent }));
    chatMsg(`📊 Тест "${testQuestions[type].q[0].substring(0, 20)}..." завершён! Результат сохранён.`);
}

function loadSavedTests() {
    ['fatigue', 'stress', 'sleep'].forEach(t => {
        const saved = localStorage.getItem(`${t}_${currentUser}`);
        if (saved) {
            const p = JSON.parse(saved).percent;
            if (t === 'fatigue') document.getElementById('energyFill1').style.width = (100 - p) + '%';
            if (t === 'stress') document.getElementById('energyFill2').style.width = (100 - p) + '%';
            if (t === 'sleep') document.getElementById('energyFill3').style.width = (100 - p) + '%';
        }
    });
}

// ========== СМЕНА РЕЖИМА ==========
function switchMode(mode) {
    currentMode = mode;
    document.getElementById('modeBadge').innerHTML = mode === 'quest' ? '🎮 КВЕСТ' : '🧠 ТЕСТЫ';
    
    if (mode === 'quest') {
        renderQuestContent();
    } else {
        renderTestsContent();
    }
    
    // Обновляем активную кнопку в нижней навигации
    document.querySelectorAll('.nav-item').forEach(item => {
        if (item.dataset.nav === mode) item.classList.add('active');
        else item.classList.remove('active');
    });
}

// ========== АВТОРИЗАЦИЯ ==========
let selectedMode = "quest";

document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMode = btn.dataset.mode;
    };
});

function login() {
    const loginVal = document.getElementById('loginInput').value.trim();
    const passVal = document.getElementById('passwordInput').value;
    
    if ((loginVal === 'admin' && passVal === '1234') || (loginVal === 'test' && passVal === 'test')) {
        currentUser = loginVal;
        currentMode = selectedMode;
        localStorage.setItem('currentUser', loginVal);
        localStorage.setItem('lastMode', selectedMode);
        
        document.getElementById('userName').innerText = loginVal;
        document.getElementById('loginScreen').style.opacity = '0';
        
        setTimeout(() => {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            switchMode(currentMode);
            chatMsg(`👋 Добро пожаловать, ${loginVal}! Вы в режиме "${currentMode === 'quest' ? 'Квест' : 'Психотесты'}"`);
        }, 400);
    } else {
        alert('❌ Неверный логин или пароль! Попробуйте admin/1234 или test/test');
        document.querySelector('.login-btn').classList.add('shake');
        setTimeout(() => document.querySelector('.login-btn').classList.remove('shake'), 300);
    }
}

// ========== ЗВЕЗДНЫЙ ФОН ==========
function createStars() {
    for (let i = 0; i < 120; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.width = Math.random() * 2 + 1 + 'px';
        s.style.height = s.style.width;
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.opacity = Math.random() * 0.7;
        document.body.appendChild(s);
    }
}

// ========== ИНИЦИАЛИЗАЦИЯ ==========
document.addEventListener('DOMContentLoaded', () => {
    createStars();
    
    // Чат
    document.getElementById('chatFab').onclick = () => {
        const win = document.getElementById('chatWindow');
        win.style.display = win.style.display === 'none' ? 'block' : 'none';
    };
    document.getElementById('closeChat').onclick = () => document.getElementById('chatWindow').style.display = 'none';
    document.getElementById('chatSendBtn').onclick = () => {
        const inp = document.getElementById('chatInput');
        if (inp.value.trim()) chatMsg(inp.value);
        inp.value = '';
    };
    document.getElementById('chatInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') document.getElementById('chatSendBtn').click();
    });
    
    // Нижняя навигация
    document.querySelectorAll('.nav-item').forEach(nav => {
        nav.onclick = () => {
            if (nav.dataset.nav === 'quest') switchMode('quest');
            else if (nav.dataset.nav === 'tests') switchMode('tests');
            else if (nav.dataset.nav === 'help') emergencyHelp();
        };
    });
    
    // Восстановление сессии
    const savedUser = localStorage.getItem('currentUser');
    const savedMode = localStorage.getItem('lastMode');
    if (savedUser && (savedUser === 'admin' || savedUser === 'test')) {
        currentUser = savedUser;
        currentMode = savedMode === 'tests' ? 'tests' : 'quest';
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('userName').innerText = currentUser;
        switchMode(currentMode);
    }
    
    // Enter для входа
    document.getElementById('loginInput').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
    document.getElementById('passwordInput').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
});
</script>
