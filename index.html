<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Адаптометр | Квест с AI помощником</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a0f2a 0%, #0a1a3a 50%, #0a0f2a 100%);
    font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
    overflow-x: hidden;
}

/* Звезды */
.stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    0% { opacity: 0.2; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.2); }
}

/* ===== ЛОГИН ===== */
#loginScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    background: linear-gradient(135deg, #0a0f2a, #0a1a3a);
    transition: opacity 0.8s ease;
}

.login-container {
    text-align: center;
    padding: 40px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border-radius: 60px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 50px rgba(0,200,255,0.2);
    animation: floatIn 0.8s ease;
}

@keyframes floatIn {
    from { opacity: 0; transform: translateY(50px); }
    to { opacity: 1; transform: translateY(0); }
}

.logo-large {
    font-size: 72px;
    font-weight: 800;
    background: linear-gradient(135deg, #fff, #4facfe, #00f2fe);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
}

.subtitle {
    color: rgba(255,255,255,0.7);
    margin-bottom: 30px;
}

.login-input {
    width: 280px;
    padding: 15px 20px;
    margin: 10px 0;
    border: none;
    border-radius: 50px;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 16px;
}

.login-input:focus {
    outline: none;
    background: rgba(255,255,255,0.2);
}

.login-btn {
    padding: 12px 40px;
    margin-top: 20px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(45deg, #4facfe, #00f2fe);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}

.login-btn:hover {
    transform: scale(1.05);
}

/* ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== */
#mainApp {
    display: none;
    position: relative;
    z-index: 1;
    padding: 20px;
    min-height: 100vh;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    border-radius: 60px;
    margin-bottom: 30px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    background: linear-gradient(135deg, #fff, #4facfe);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.user-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(79,172,254,0.2);
    padding: 8px 18px;
    border-radius: 40px;
}

/* ===== ЧАТ С РОБОТОМ ===== */
.chat-container {
    position: fixed;
    bottom: 100px;
    right: 20px;
    z-index: 200;
    width: 350px;
    background: rgba(10,15,42,0.95);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    border: 1px solid rgba(79,172,254,0.3);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    transform: translateX(400px);
    transition: transform 0.3s ease;
}

.chat-container.open {
    transform: translateX(0);
}

.chat-header {
    padding: 15px;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    border-radius: 20px 20px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}

.chat-header h4 {
    display: flex;
    align-items: center;
    gap: 8px;
}

.close-chat {
    background: none;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.chat-messages {
    height: 300px;
    overflow-y: auto;
    padding: 15px;
}

.message {
    margin-bottom: 12px;
    display: flex;
    gap: 8px;
    animation: messageSlide 0.3s ease;
}

@keyframes messageSlide {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.bot {
    justify-content: flex-start;
}

.message.user {
    justify-content: flex-end;
}

.message-content {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 15px;
    font-size: 13px;
}

.message.bot .message-content {
    background: rgba(79,172,254,0.2);
    border-radius: 15px 15px 15px 5px;
}

.message.user .message-content {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border-radius: 15px 15px 5px 15px;
}

.chat-input-area {
    padding: 15px;
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex;
    gap: 10px;
}

.chat-input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 20px;
    background: rgba(255,255,255,0.1);
    color: white;
}

.chat-send {
    padding: 10px 15px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(45deg, #4facfe, #00f2fe);
    color: white;
    cursor: pointer;
}

.typing-indicator {
    display: flex;
    gap: 4px;
    padding: 8px 12px;
}

.typing-indicator span {
    width: 6px;
    height: 6px;
    background: #4facfe;
    border-radius: 50%;
    animation: typing 1.4s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-10px); }
}

/* Кнопка открытия чата */
.chat-toggle {
    position: fixed;
    bottom: 30px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border: none;
    cursor: pointer;
    z-index: 199;
    box-shadow: 0 0 20px rgba(79,172,254,0.5);
    animation: bounce 2s infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* ===== НАПРАВЛЕНИЯ ===== */
.quest-title {
    text-align: center;
    font-size: 42px;
    margin-bottom: 40px;
    background: linear-gradient(135deg, #fff, #4facfe, #00f2fe);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.directions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto;
}

.direction-card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    border-radius: 30px;
    padding: 25px;
    text-align: center;
    transition: all 0.4s;
    border: 1px solid rgba(255,255,255,0.1);
    animation: cardAppear 0.5s ease backwards;
}

.direction-card:hover {
    transform: translateY(-10px);
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.sphere {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(145deg, #1e3c72, #2a5298);
    box-shadow: 0 0 20px rgba(0,150,255,0.5);
    cursor: pointer;
    transition: all 0.3s;
    margin: 20px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: spherePulse 2s infinite;
}

@keyframes spherePulse {
    0% { box-shadow: 0 0 0 0 rgba(79,172,254,0.4); }
    70% { box-shadow: 0 0 0 15px rgba(79,172,254,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,172,254,0); }
}

.sphere:hover {
    transform: scale(1.1);
}

.sphere.done {
    background: linear-gradient(145deg, #00ff99, #00cc66);
    box-shadow: 0 0 30px #00ff99;
}

.sphere.done::after {
    content: "✓";
    font-size: 48px;
    font-weight: bold;
    color: white;
}

/* Прогресс */
.global-progress {
    max-width: 500px;
    margin: 40px auto;
    text-align: center;
}

.progress-bar-container {
    background: rgba(255,255,255,0.1);
    border-radius: 30px;
    height: 20px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    border-radius: 30px;
    transition: width 0.5s ease;
}

/* Модалка */
.modal {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(10px);
    z-index: 300;
}

.modal-content {
    background: linear-gradient(135deg, #1a1a3e, #0f0f2a);
    padding: 40px;
    border-radius: 40px;
    text-align: center;
}

.modal-code-input {
    width: 100%;
    padding: 15px;
    margin: 20px 0;
    border: none;
    border-radius: 60px;
    background: rgba(255,255,255,0.1);
    color: white;
    text-align: center;
}

.modal-btn {
    padding: 12px 30px;
    margin: 5px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(45deg, #4facfe, #00f2fe);
    color: white;
    cursor: pointer;
}

/* Сертификат */
.certificate {
    text-align: center;
    margin-top: 40px;
    padding: 30px;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    border-radius: 30px;
}

.certificate-code {
    font-size: 28px;
    font-weight: bold;
    background: white;
    display: inline-block;
    padding: 15px 30px;
    border-radius: 50px;
    margin-top: 20px;
}
</style>
</head>
<body>

<div id="loginScreen">
    <div class="login-container">
        <div class="logo-large">АДАПТО<br>МЕТР</div>
        <div class="subtitle">приложение • квест • AI помощник</div>
        <input type="text" id="loginInput" class="login-input" placeholder="Логин">
        <input type="password" id="passwordInput" class="login-input" placeholder="Пароль">
        <button class="login-btn" onclick="login()">Войти</button>
        <div style="margin-top: 15px; font-size: 12px;">admin / 1234</div>
    </div>
</div>

<div id="mainApp">
    <div class="header">
        <div class="logo">⚡ АДАПТОМЕТР</div>
        <div class="user-badge">
            <span>👤</span>
            <span id="userName">admin</span>
        </div>
    </div>

    <h1 class="quest-title">🎯 КВЕСТ-МАРАФОН</h1>

    <div class="directions-grid" id="directionsGrid"></div>

    <div class="global-progress">
        <div class="progress-bar-container">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">0% завершено</div>
    </div>

    <div id="certificateContainer" style="display: none;">
        <div class="certificate">
            <h2>🏆 ПОЗДРАВЛЯЕМ! 🏆</h2>
            <div class="certificate-code" id="certificateCode"></div>
        </div>
    </div>
</div>

<!-- Кнопка чата -->
<button class="chat-toggle" id="chatToggle">🤖</button>

<!-- Окно чата -->
<div class="chat-container" id="chatContainer">
    <div class="chat-header" id="chatHeader">
        <h4>🤖 AI Помощник DeepSeek</h4>
        <button class="close-chat" id="closeChat">×</button>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            <div class="message-content">👋 Привет! Я AI-помощник на базе DeepSeek. Могу помочь с квестами, подсказать коды или просто поболтать! Спрашивай!</div>
        </div>
    </div>
    <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="Спроси у AI..." autocomplete="off">
        <button class="chat-send" id="chatSend">📤</button>
    </div>
</div>

<!-- Модалка для кодов -->
<div class="modal" id="codeModal">
    <div class="modal-content">
        <h3>🔐 Введите код активации</h3>
        <input type="text" id="modalCodeInput" class="modal-code-input" placeholder="Код">
        <button class="modal-btn" onclick="verifyCode()">Активировать</button>
        <button class="modal-btn" onclick="closeModal()" style="background: #666;">Отмена</button>
    </div>
</div>

<script>
// ========== НАСТРОЙКИ DEEPSEEK API ==========
// ⚠️ ВАЖНО: Замените на ваш реальный API ключ от DeepSeek
// Получить ключ можно на https://platform.deepseek.com/
const DEEPSEEK_API_KEY = 'sk-352e8cc3162d400a93a5f9240f2a0712; // <-- ВСТАВЬТЕ ВАШ КЛЮЧ СЮДА
const DEEPSEEK_API_URL = 'https://api.deepseek.com/v1/chat/completions';

// Данные пользователей
const USERS = { admin: "1234", test1: "1111", test2: "2222" };

// Направления квеста
const DIRECTIONS = [
    { name: "Донорское движение", icon: "🩸", code: "DONOR2024" },
    { name: "Тьюторское движение", icon: "📚", code: "TUTOR2024" },
    { name: "Тренинговый центр", icon: "🎓", code: "TRAIN2024" },
    { name: "СНК", icon: "🔬", code: "SNK2024" },
    { name: "Спортивные секции", icon: "⚽", code: "SPORT2024" },
    { name: "Волонтерский центр", icon: "🤝", code: "VOLON2024" },
    { name: "Медиа-штаб", icon: "📸", code: "MEDIA2024" }
];

let currentUser = null;
let currentDirectionIndex = null;
let currentSphereElement = null;

// ========== ФУНКЦИИ ЧАТА С DEEPSEEK ==========
async function sendToDeepSeek(userMessage) {
    // Если нет API ключа, используем локальные ответы
    if (!DEEPSEEK_API_KEY || DEEPSEEK_API_KEY === 'YOUR_DEEPSEEK_API_KEY_HERE') {
        return getLocalResponse(userMessage);
    }
    
    try {
        const response = await fetch(DEEPSEEK_API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
            },
            body: JSON.stringify({
                model: "deepseek-chat",
                messages: [
                    {
                        role: "system",
                        content: `Ты дружелюбный AI-помощник в квест-игре "Адаптометр". 
                        Ты помогаешь пользователю проходить квест. 
                        В игре есть 7 направлений: Донорское движение, Тьюторское движение, 
                        Тренинговый центр, СНК, Спортивные секции, Волонтерский центр, Медиа-штаб.
                        Коды активации состоят из названия направления + 2024 (например DONOR2024).
                        Отвечай кратко и дружелюбно, используй эмодзи.`
                    },
                    {
                        role: "user",
                        content: userMessage
                    }
                ],
                temperature: 0.7,
                max_tokens: 500
            })
        });
        
        const data = await response.json();
        
        if (data.choices && data.choices[0]) {
            return data.choices[0].message.content;
        } else {
            console.error('DeepSeek API error:', data);
            return getLocalResponse(userMessage);
        }
    } catch (error) {
        console.error('Ошибка подключения к DeepSeek:', error);
        return getLocalResponse(userMessage);
    }
}

// Локальные ответы (если нет API ключа)
function getLocalResponse(message) {
    const msg = message.toLowerCase();
    
    if (msg.includes('привет') || msg.includes('здравствуй')) {
        return "👋 Приветствую в Адаптометре! Я твой AI-помощник. Чем могу помочь?";
    }
    if (msg.includes('код') || msg.includes('подскажи')) {
        return "💡 Подсказка: Коды для активации сфер - это название направления заглавными буквами + 2024. Например, для донорского движения: DONOR2024. Удачи! 🍀";
    }
    if (msg.includes('сколько') || msg.includes('направление')) {
        return "🎯 В квесте 7 направлений: Донорское движение, Тьюторское движение, Тренинговый центр, СНК, Спортивные секции, Волонтерский центр и Медиа-штаб. В каждом по одной сфере!";
    }
    if (msg.includes('спасибо')) {
        return "Всегда рад помочь! 😊 Обращайся, если что-то нужно!";
    }
    if (msg.includes('прогресс')) {
        const progress = getProgress();
        const completed = DIRECTIONS.filter(d => progress[d.code]).length;
        return `📊 Твой прогресс: ${completed} из ${DIRECTIONS.length} направлений пройдено (${Math.round(completed/DIRECTIONS.length*100)}%). Продолжай в том же духе! 💪`;
    }
    
    return "🤔 Отличный вопрос! Если тебе нужна подсказка по квесту - спроси про коды или направления. А если хочешь просто поболтать - я всегда рад! 😊";
}

// Добавление сообщения в чат
function addMessage(text, isUser = false) {
    const messagesDiv = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
    messageDiv.innerHTML = `<div class="message-content">${text}</div>`;
    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// Показать индикатор печати
function showTyping() {
    const messagesDiv = document.getElementById('chatMessages');
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message bot';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = `<div class="message-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
    messagesDiv.appendChild(typingDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function hideTyping() {
    const typing = document.getElementById('typingIndicator');
    if (typing) typing.remove();
}

// Отправка сообщения
async function sendMessage() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    
    if (!message) return;
    
    addMessage(message, true);
    input.value = '';
    showTyping();
    
    const response = await sendToDeepSeek(message);
    hideTyping();
    addMessage(response, false);
}

// ========== ФУНКЦИИ КВЕСТА ==========
function getProgress() {
    const saved = localStorage.getItem(`progress_${currentUser}`);
    return saved ? JSON.parse(saved) : {};
}

function saveProgress(progress) {
    localStorage.setItem(`progress_${currentUser}`, JSON.stringify(progress));
    updateProgress();
    checkAllCompleted();
}

function updateProgress() {
    const progress = getProgress();
    const completed = DIRECTIONS.filter(d => progress[d.code]).length;
    const percent = (completed / DIRECTIONS.length) * 100;
    
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressText').textContent = `${completed}/${DIRECTIONS.length} направлений (${Math.round(percent)}%)`;
}

function renderDirections() {
    const container = document.getElementById('directionsGrid');
    const progress = getProgress();
    container.innerHTML = '';
    
    DIRECTIONS.forEach((dir, idx) => {
        const isCompleted = progress[dir.code];
        const card = document.createElement('div');
        card.className = 'direction-card';
        card.style.animationDelay = `${idx * 0.05}s`;
        
        card.innerHTML = `
            <div style="font-size: 50px; margin-bottom: 15px;">${dir.icon}</div>
            <div class="direction-name">${dir.name}</div>
            <div class="sphere ${isCompleted ? 'done' : ''}" data-idx="${idx}"></div>
            <div>
                <span style="padding: 5px 12px; border-radius: 20px; background: ${isCompleted ? 'rgba(0,255,153,0.2)' : 'rgba(255,255,255,0.1)'}; color: ${isCompleted ? '#00ff99' : '#aaa'}">
                    ${isCompleted ? '✓ Пройдено' : '⭕ Ожидает'}
                </span>
            </div>
        `;
        
        container.appendChild(card);
        
        const sphere = card.querySelector('.sphere');
        sphere.addEventListener('click', () => {
            if (!progress[dir.code]) {
                openModal(idx, sphere, dir.code);
            } else {
                addMessage(`Направление "${dir.name}" уже пройдено! Отличная работа! 🎉`, false);
            }
        });
    });
}

function openModal(idx, element, code) {
    if (getProgress()[code]) return;
    currentDirectionIndex = idx;
    currentSphereElement = element;
    document.getElementById('codeModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('codeModal').style.display = 'none';
}

function verifyCode() {
    const inputCode = document.getElementById('modalCodeInput').value.trim();
    const direction = DIRECTIONS[currentDirectionIndex];
    const progress = getProgress();
    
    if (inputCode === direction.code) {
        progress[direction.code] = true;
        saveProgress(progress);
        
        if (currentSphereElement) {
            currentSphereElement.classList.add('done');
        }
        
        addMessage(`🎉 Поздравляю! Ты "${direction.name}"! Осталось пройти еще ${DIRECTIONS.length - Object.keys(progress).length} направлений!`, false);
        renderDirections();
        closeModal();
    } else {
        addMessage(`❌ Код "${inputCode}" не подходит для "${direction.name}". Попробуй еще раз! Подсказка: используй название направления + 2024`, false);
        const input = document.getElementById('modalCodeInput');
        input.style.animation = 'shake 0.3s';
        setTimeout(() => input.style.animation = '', 300);
    }
}

function checkAllCompleted() {
    const progress = getProgress();
    const allCompleted = DIRECTIONS.every(d => progress[d.code]);
    const certificateDiv = document.getElementById('certificateContainer');
    
    if (allCompleted && DIRECTIONS.length > 0) {
        certificateDiv.style.display = 'block';
        const certCode = document.getElementById('certificateCode');
        if (!certCode.innerText) {
            const rewardCode = "MERCH-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            certCode.innerText = rewardCode;
            addMessage(`🏆 НЕВЕРОЯТНО! Ты прошел весь квест "Адаптометр"! Твой код на мерч: ${rewardCode}. Поздравляю! 🎊🎉`, false);
        }
    }
}

// ========== ИНИЦИАЛИЗАЦИЯ ==========
function login() {
    const loginVal = document.getElementById('loginInput').value.trim();
    const passVal = document.getElementById('passwordInput').value;
    
    if (USERS[loginVal] === passVal) {
        currentUser = loginVal;
        localStorage.setItem('currentUser', loginVal);
        document.getElementById('userName').textContent = loginVal;
        
        const loginScreen = document.getElementById('loginScreen');
        loginScreen.style.opacity = '0';
        setTimeout(() => {
            loginScreen.style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            renderDirections();
            updateProgress();
            addMessage(`👋 Добро пожаловать в Адаптометр, ${loginVal}! Я твой AI-помощник. Спрашивай меня о кодах, направлениях или просто болтай!`, false);
        }, 500);
    } else {
        alert('Неверный логин или пароль!');
    }
}

// Настройка чата
document.getElementById('chatToggle').onclick = () => {
    const container = document.getElementById('chatContainer');
    container.classList.toggle('open');
};

document.getElementById('closeChat').onclick = () => {
    document.getElementById('chatContainer').classList.remove('open');
};

document.getElementById('chatSend').onclick = sendMessage;
document.getElementById('chatInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
});

// Звезды
function createStars() {
    for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.width = Math.random() * 3 + 'px';
        star.style.height = star.style.width;
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 5 + 's';
        document.body.appendChild(star);
    }
}
createStars();

// Восстановление сессии
const savedUser = localStorage.getItem('currentUser');
if (savedUser && USERS[savedUser]) {
    currentUser = savedUser;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('userName').textContent = currentUser;
    renderDirections();
    updateProgress();
}
</script>
